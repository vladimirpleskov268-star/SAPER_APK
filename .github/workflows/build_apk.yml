name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf automake libtool m4 pkg-config \
            gettext autopoint libltdl-dev zlib1g-dev libncurses-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev lld

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" "setuptools<71.0.0" buildozer

      - name: Set up Android SDK for Buildozer
        run: |
          # Create buildozer's expected SDK directory structure
          mkdir -p ~/.buildozer/android/platform/android-sdk

          # Symlink system Android SDK components into buildozer's location
          ln -sf $ANDROID_HOME/cmdline-tools ~/.buildozer/android/platform/android-sdk/
          ln -sf $ANDROID_HOME/platform-tools ~/.buildozer/android/platform/android-sdk/
          ln -sf $ANDROID_HOME/platforms ~/.buildozer/android/platform/android-sdk/
          ln -sf $ANDROID_HOME/build-tools ~/.buildozer/android/platform/android-sdk/

          # Create old-style tools/bin/ path that buildozer expects
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager \
                 ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager

          # Accept all Android SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          # Copy licenses into buildozer's SDK directory
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/

          # Install required SDK components
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper2D-APK
          path: bin/*.apk
